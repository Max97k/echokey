name: Android License Compliance & SBOM

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  compliance-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python Bridge SPDX Headers & Unit Tests
        run: python3 -m unittest discover -s tools -p "test_*.py"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Kotlin License Headers
        run: ./gradlew :app:spotlessCheck --console=plain

      - name: Check Third-Party Dependency Licenses
        run: ./gradlew :app:licenseeAndroidRelease --console=plain

      - name: Generate Software BOM (CycloneDX SBOM)
        run: ./gradlew :app:cyclonedxDirectBom --console=plain

      - name: Run Unit Tests & Strict Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sbom
          path: app/build/reports/sbom.json
